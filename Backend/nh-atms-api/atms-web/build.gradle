// atms-web : 화면 백엔드 (Web/REST) — web/common·나(/api/me)·메뉴·공통조회·행위이력·견본 화면
// 근거: nh-atms atms-web/build.gradle (업무 전용 gson·prometheus·프론트 dist 동봉은 뺐다)
plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':atms-common')

    // p6spy(SQL 로그 도구)는 넣지 않는다 — 2026-11-09 사용자 결정(docs/92 §2-4)
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // 헬스체크
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}
