# 로컬 bootRun/IntelliJ 전용 (devtools 는 developmentOnly 라 WAR 에는 영향 없음)
# MyBatis jar 를 devtools 재시작 클래스로더에 함께 올린다.
# 안 하면: 소스 저장 → devtools 자동 재시작 때 MybatisProperties 가 첫 기동의 (이미 멈춘) 톰캣 클래스로더를 붙잡고 있어
#   "Illegal access: this web application instance has been stopped already. Could not load [mapper/]" 로 기동 실패.
restart.include.mybatis=/mybatis[\\w.-]*\\.jar
